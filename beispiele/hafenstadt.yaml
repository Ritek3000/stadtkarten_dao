# Beispiel-Stadt für "Die Alte Ordnung"
# Aufruf:  .venv\Scripts\python -m stadtkarte beispiele\hafenstadt.yaml

name: Rabenfurt
# kennung: rabenfurt   # fester Name für das Web-Paket (bleibt bei Umbenennung gleich); sonst aus dem Namen gebildet
seed: 1234            # gleiche Zahl + gleiche Angaben = gleiche Karte
einwohner: 6000       # bestimmt die Größe der Stadt (100 bis 250000; ab 20000 Großstadt mit Häuserblöcken)
bebauung: dicht       # dicht | locker | weitlaeufig - gleiche Einwohner auf mehr Fläche
# stadtform: zufall    # Umriss: zufall (je Seed) | rund | oval | unregelmaessig | vieleck | gewachsen

gelaende:
  kueste: nord        # nord | ost | sued | west | keine
  fluss: true
  flussbreite: 60
  bruecken: 1         # Brücken über den Fluss in der Stadt: 1 bis 5 (bei einem Hafen flussaufwärts davon)
  inseln: 3
  wald: [west, suedwest]
  felder: [ost, suedost, sued]
  # staub: {a3: finsternis, b4: mittel, d1: wenig, ueberall: wenig}   # 5x5-Raster a1..e5 (oben links a1); wenig | mittel | finsternis

mauer:
  vorhanden: true
  tore: 4
  vorstaedte: true    # false = keine Häuser und Vorstädte vor den Toren

# typ: hafen | handwerk | arbeiter | fischer | bauern | adel | tempel | markt | wohn | armen (Armenviertel)
# lage (optional): nord | nordost | ost | suedost | sued | suedwest | west | nordwest | mitte
# viertel weglassen (oder leere Liste) = einheitliche Bebauung ohne Viertelnamen
viertel:
  - name: Hafen
    typ: hafen
    groesse: gross     # Hafen: klein | mittel | gross
  - name: Handwerkerviertel
    typ: handwerk
    lage: west
  - name: Fischerviertel
    typ: fischer
    lage: nordost
  - name: Arbeiterviertel
    typ: arbeiter
    lage: ost
  - name: Bauernviertel
    typ: bauern
    lage: suedost

# typ: gasthaus | kontor | adelshaus | palast | rathaus | tempel | kathedrale | schmiede | muehle | wassermuehle | werft
#      | kaserne | friedhof | laden | bauernhof | marktplatz | badehaus | magierturm | arena | faerberei | hafenkran
#      | kloster | richtstaette   (kloster und richtstaette stehen vor der Stadt, faerberei und hafenkran am Wasser)
#      muehle (Windmühle) und bauernhof stehen vor der Stadt an einer Landstraße, wassermuehle am Flussufer
#      festung (bzw. bastion/burg) mit lage: insel | landzunge | land  - steht außerhalb der Stadt
#      friedhof mit lage: ausserhalb  - liegt dann vor einem Tor (passiert auch automatisch, wenn im Ort kein Platz ist)
# kuerzel (optional): statt des Namens steht das Kürzel auf der Karte, der Name in der Legende
# anzahl (optional): so viele Orte dieser Art, fortlaufend nummeriert, z.B. kuerzel: S, anzahl: 5 -> S1 bis S5;
#        weitere Einträge mit demselben Kürzel zählen weiter (etwa 3 Schenken in einem anderen Viertel: S6 bis S8)
orte:
  - name: Kontor
    typ: kontor
    viertel: Hafen
  - name: Werft
    typ: werft
    viertel: Hafen
  - name: Haus Lorint
    typ: adelshaus
    viertel: Handwerkerviertel
  - name: Schmiede
    typ: schmiede
    viertel: Handwerkerviertel
  - name: Die Brücke
    typ: gasthaus
    viertel: Handwerkerviertel
  - name: Mühle
    typ: wassermuehle
    viertel: Bauernviertel
  - name: Gasthaus Zum Fass
    kuerzel: H3
    typ: gasthaus
    viertel: Handwerkerviertel
  - name: Herberge Seeblick
    kuerzel: H4
    typ: gasthaus
    viertel: Arbeiterviertel
  - name: Schrein der Alten
    kuerzel: S1
    typ: tempel
    viertel: Arbeiterviertel
  - name: Bastion
    typ: festung
    lage: insel
  - name: Wachkaserne
    typ: kaserne
    viertel: Bauernviertel
  - name: Gräberfeld
    kuerzel: F1
    typ: friedhof
    viertel: Bauernviertel

ausgabe:
  bildgroesse: 2000   # Kantenlänge in Pixeln
  ausschnitt: weit    # weit | normal | nah | fuellend - wie viel der Karte die Stadt einnimmt
  stil: pergament     # pergament (altes Papier) | standard (ohne Papier) | tusche | aquarell | sepia | schatzkarte
                      # | abendlicht (Goldene Stunde) | farbdruck | pastell | bleistift | stich (Kolorierter Stich)
  formate: [svg, png, pdf]   # dazu html: interaktive Karte zum Zoomen, Beschriftung ein-/ausblendbar;
                             # web: Web-Paket für die eigene Webseite (Ordner <kennung>_web)
  raster: 0           # >0 zeichnet ein Quadratraster (Pixel pro Feld), z.B. für Foundry/Roll20
  legende: true
  dachdetails: true  # Dachmaterial (Ziegel, Schiefer, Reet, Schnee), Licht und Schornsteine
  nacht: false       # true = diese Karte als Nachtkarte mit Laternen und erleuchteten Fenstern zeichnen
                     # (Kommandozeile; die Werkstatt zeigt immer beide und braucht es nicht)
  nachtkarte: true   # Werkstatt: zusätzlich zur Tagkarte die Nachtkarte berechnen (zum Umschalten in der Ansicht)
