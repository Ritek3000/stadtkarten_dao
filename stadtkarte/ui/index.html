<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12100e">
<title>Stadtkarten-Werkstatt</title>
<link rel="icon" type="image/png" href="/static/favicon-32.png">
<link rel="stylesheet" href="/api/font.css">
<script>
// Design vor dem ersten Zeichnen setzen (gespeicherte Wahl, sonst Systemeinstellung)
try { const t = localStorage.getItem("dao-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
/* Schriften und Farben nach dem Design System „Die Alte Ordnung“ */
@font-face { font-family: "IM Fell English"; font-weight: 400; font-style: normal; font-display: swap; src: url(/static/im-fell-english-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "IM Fell English"; font-weight: 400; font-style: italic; font-display: swap; src: url(/static/im-fell-english-latin-400-italic.woff2) format("woff2"); }
@font-face { font-family: "Spectral"; font-weight: 400; font-style: normal; font-display: swap; src: url(/static/spectral-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Spectral"; font-weight: 400; font-style: italic; font-display: swap; src: url(/static/spectral-latin-400-italic.woff2) format("woff2"); }
@font-face { font-family: "Spectral"; font-weight: 700; font-style: normal; font-display: swap; src: url(/static/spectral-latin-700-normal.woff2) format("woff2"); }

:root {
  --bg: #fbf8f1; --surface: #f1eadb; --ink: #191210; --ink-soft: #57493e;
  --gold: #8a7426; --gold-hi: #ccb454; --on-gold: #191210; --oxblood: #7a1f1f; --err: #8a2323;
  --line: rgba(120,98,40,.28); --veil: rgba(251,248,241,.8);
  --font-display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --font-body: "Spectral", Georgia, "Times New Roman", serif;
  --ease-staub: cubic-bezier(.16,.84,.24,1); --ease-glut: cubic-bezier(.55,.05,.35,1); --ease-klinge: cubic-bezier(.7,0,.2,1);
  --t-kurz: .24s;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12100e; --surface: #191210; --ink: #ece3cf; --ink-soft: #b6aa93;
    --gold: #ccb454; --oxblood: #a3302b; --err: #e48a7e;
    --line: rgba(204,180,84,.24); --veil: rgba(18,16,14,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12100e; --surface: #191210; --ink: #ece3cf; --ink-soft: #b6aa93;
  --gold: #ccb454; --oxblood: #a3302b; --err: #e48a7e;
  --line: rgba(204,180,84,.24); --veil: rgba(18,16,14,.8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 1rem/1.5 var(--font-body); -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; transition: background-color .4s ease, color .4s ease; }
:focus-visible { outline: 1px solid var(--gold); outline-offset: 4px; }
h1, h2 { font-family: var(--font-display); font-weight: 400; line-height: 1.1; margin: 0; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; display: block; }

/* Kopfzeile */
header.bar { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; padding: .7rem clamp(1rem, 3vw, 1.8rem); border-bottom: 1px solid var(--line); }
.brand { display: flex; gap: .7rem; align-items: center; }
.brand .mark { width: 20px; height: 26px; background: url(/static/sor-symbol.png) center/contain no-repeat; flex: none; }
.brand h1 { font-size: 1.45rem; }
.brand .ver { font-family: var(--font-body); font-size: .8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; letter-spacing: .02em; margin-left: .35rem; white-space: nowrap; }
.brand .ver:empty { display: none; }
.brand .eyebrow { display: block; font-family: var(--font-display); font-style: italic; color: var(--gold); font-size: .95rem; line-height: 1.2; }
header .sp { flex: 1; }
header .tools { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
header .tools label { display: flex; align-items: center; gap: .5rem; color: var(--ink-soft); font-size: .95rem; }

.round { width: 38px; height: 38px; display: grid; place-items: center; background: none; border: 1px solid transparent; border-radius: 50%;
  color: var(--ink-soft); cursor: pointer; padding: 0; transition: color var(--t-kurz) ease, border-color var(--t-kurz) ease; }
.round:hover, .round:focus-visible { color: var(--ink); border-color: var(--line); }
.round svg { width: 20px; height: 20px; grid-area: 1/1; transition: transform .5s var(--ease-staub), opacity .3s ease; }
.theme .sonne circle, .theme .mond { fill: currentColor; stroke: none; }
:root[data-theme="dark"] .theme .sonne { opacity: 0; transform: rotate(-90deg) scale(.6); }
:root:not([data-theme="dark"]) .theme .mond { opacity: 0; transform: rotate(90deg) scale(.6); }

[hidden] { display: none !important; }
main { flex: 1; display: flex; min-height: 0; }
#home, #wizard { flex: 1; min-width: 0; overflow-y: auto; }
#viewer { flex: 1; display: flex; min-width: 0; min-height: 0; }
.vmain { flex: 1; display: flex; flex-direction: column; min-width: 0; }
aside { width: 440px; min-width: 340px; overflow-y: auto; border-right: 1px solid var(--line); padding: .4rem 1.4rem 6rem; }

/* Abschnitte der Seitenleiste */
details { border-bottom: 1px solid var(--line); }
summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: .7rem; padding: 1rem 0 .9rem;
  font-family: var(--font-display); font-size: 1.45rem; line-height: 1.1; color: var(--ink); }
summary::-webkit-details-marker { display: none; }
summary::before { content: ""; width: .45rem; height: .45rem; border-right: 1.5px solid var(--gold); border-bottom: 1.5px solid var(--gold);
  transform: rotate(-45deg); transition: transform .3s var(--ease-klinge); flex: none; margin-left: .1rem; }
details[open] > summary::before { transform: rotate(45deg); }
summary .count { font-family: var(--font-body); font-size: .95rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
aside .box { padding: 0 0 1.4rem; }
.generate { position: sticky; bottom: -6rem; padding: 1.2rem 0 1.4rem; background: linear-gradient(transparent, var(--bg) 35%); }

/* Startseite: vier Wege zur Karte */
#home { display: flex; padding: 2rem clamp(1rem, 3vw, 1.8rem) 3rem; }
.home-in { width: min(100%, 780px); margin: auto; text-align: center; }
.home-in .sun { width: 96px; aspect-ratio: 800/1035; margin: 0 auto 1.4rem; background: url(/static/sor-symbol.png) center/contain no-repeat; opacity: .5;
  -webkit-mask-image: linear-gradient(#000 55%, transparent 98%); mask-image: linear-gradient(#000 55%, transparent 98%); }
.eyebrow { display: block; font-family: var(--font-display); font-style: italic; color: var(--gold); font-size: 1.15rem; }
.home-in h2 { font-size: clamp(2rem, 4vw, 3rem); margin: .3rem 0 1.8rem; }
.choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; text-align: left; }
.choice { position: relative; overflow: hidden; isolation: isolate; display: grid; gap: .45rem; align-content: start; padding: 1.2rem 1.35rem 1.3rem;
  border: 1px solid var(--line); border-bottom-color: color-mix(in srgb, var(--gold) 60%, transparent); border-radius: 2px;
  background: color-mix(in srgb, var(--surface) 55%, transparent); color: var(--ink); cursor: pointer; text-align: left;
  transition: border-color var(--t-kurz) ease; }
.choice::before { content: ""; position: absolute; inset: 0; z-index: -1; background: color-mix(in srgb, var(--gold-hi) 16%, transparent);
  transform: translateY(101%); transition: transform .45s var(--ease-staub); }
.choice:hover:not(:disabled), .choice:focus-visible { border-color: var(--gold); }
.choice:hover:not(:disabled)::before, .choice:focus-visible::before { transform: translateY(0); }
.choice:active:not(:disabled) { transform: translateY(1px); }
.choice:disabled { opacity: .5; cursor: default; }
.choice .t { display: flex; align-items: center; gap: .7rem; font-family: var(--font-display); font-size: 1.5rem; line-height: 1.15; }
.choice .t svg { width: 22px; height: 22px; color: var(--gold); flex: none; }
.choice .d { color: var(--ink-soft); font-size: .95rem; line-height: 1.4; }
.examples { margin-top: 1.2rem; padding: 1rem 1.2rem 1.1rem; border: 1px solid var(--line); text-align: left;
  background: color-mix(in srgb, var(--surface) 45%, transparent); }
.exlist { display: flex; flex-wrap: wrap; gap: .5rem; }
.homemsg { margin-top: 1.2rem; min-height: 1.4em; }
.homemsg.err { color: var(--err); }

/* Assistent: eine Seite je Themenbereich */
.wiz { width: min(100%, 760px); margin: 0 auto; padding: 1.4rem clamp(1rem, 3vw, 1.8rem) 3rem; }
.steps { list-style: none; display: flex; align-items: center; margin: 0 0 1.8rem; padding: 0; }
.steps li { display: flex; align-items: center; }
.steps li + li { flex: 1 1 auto; }
.steps li + li::before { content: ""; flex: 1 1 .5rem; min-width: .4rem; height: 1px; background: var(--line); margin: 0 .35rem; }
.steps button { display: flex; align-items: center; gap: .4rem; padding: .2rem 0; background: none; border: 0; border-bottom: 1px solid transparent;
  color: var(--ink-soft); font-size: .95rem; cursor: pointer; transition: color var(--t-kurz) ease, border-color var(--t-kurz) ease; }
.steps button:hover { color: var(--ink); }
.steps .n { width: 1.55rem; height: 1.55rem; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%;
  font-size: .8rem; font-variant-numeric: tabular-nums; transition: background-color .25s ease, border-color .25s ease; }
.steps .done .n { border-color: var(--gold); color: var(--gold); }
.steps .cur button { color: var(--ink); border-bottom-color: var(--gold); }
.steps .cur .n { background: var(--gold-hi); border-color: var(--gold-hi); color: var(--on-gold); }
.wiz h2 { font-size: clamp(2rem, 4vw, 2.8rem); margin: .2rem 0 .5rem; }
.wiz h2 .count { font-family: var(--font-body); font-size: 1rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.wiz .intro { margin: 0 0 1.6rem; }
.wizerr { margin: 0 0 1.2rem; padding: .55rem 1rem; border-left: 2px solid var(--err); color: var(--err); background: color-mix(in srgb, var(--err) 8%, transparent); }
.box { display: grid; gap: .9rem; }
.wiznav { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 2rem; padding-top: 1.2rem; border-top: 1px solid var(--line); }
.wiznav .btn.big { width: auto; min-width: 14rem; }

label.f { display: grid; grid-template-columns: 7.5rem 1fr; align-items: center; gap: .8rem; }
label.f > span, .lbl { font-weight: 700; font-size: .95rem; }
.lbl { margin-bottom: .4rem; }
.hint { color: var(--ink-soft); font-size: .9rem; line-height: 1.45; }
label.f .hint { margin-top: .3rem; }
.row { display: flex; gap: .6rem; align-items: center; }

/* Felder: Fläche surface, goldene Unterkante, beim Fokus mit Glut-Gold durchgezogen */
input, select, button, textarea { font: inherit; color: var(--ink); }
input[type=text], input[type=number], select {
  width: 100%; min-width: 0; background: var(--surface); border: 1px solid var(--line);
  border-bottom-color: color-mix(in srgb, var(--gold) 60%, transparent); border-radius: 2px;
  padding: .45rem .7rem; -webkit-appearance: none; appearance: none; transition: border-color .2s ease, box-shadow .3s var(--ease-staub);
}
input[type=text]:focus, input[type=number]:focus, select:focus { outline: none; border-color: var(--gold); box-shadow: inset 0 -2px 0 var(--gold-hi); }
select { padding-right: 2.2rem; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--gold) 50%, var(--gold) calc(50% + 1.5px), transparent calc(50% + 1.5px)),
                    linear-gradient(-45deg, transparent 50%, var(--gold) 50%, var(--gold) calc(50% + 1.5px), transparent calc(50% + 1.5px));
  background-size: .4rem .4rem; background-repeat: no-repeat; background-position: right 1.05rem center, right .7rem center; }
select option { color: #191210; background: #fbf8f1; }
input[type=number] { font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--gold-hi); margin: .3rem 0 .1rem; }
input[type=checkbox] { -webkit-appearance: none; appearance: none; flex: none; width: 1.25rem; height: 1.25rem; margin: 0; border: 1px solid var(--gold);
  border-radius: 2px; background: var(--surface); display: grid; place-content: center; cursor: pointer; transition: background-color .25s ease, border-color .25s ease; }
input[type=checkbox]::before { content: ""; width: .62rem; height: .32rem; margin-top: -.15rem; border-left: 2px solid var(--on-gold); border-bottom: 2px solid var(--on-gold);
  transform: rotate(-45deg) scale(0); transition: transform .25s var(--ease-klinge); }
input[type=checkbox]:checked { background: var(--gold-hi); border-color: var(--gold-hi); }
input[type=checkbox]:checked::before { transform: rotate(-45deg) scale(1); }

/* Schaltflächen: Goldrahmen, Glut-Gold steigt beim Hover von unten in die Fläche */
.btn { position: relative; overflow: hidden; isolation: isolate; display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  padding: .45rem 1rem; border: 1px solid var(--gold); border-radius: 2px; background: none; color: var(--ink);
  font-size: .95rem; line-height: 1.3; cursor: pointer; white-space: nowrap; transition: color .3s ease; }
.btn::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--gold-hi); transform: translateY(101%); transition: transform .45s var(--ease-staub); }
.btn:hover:not(:disabled), .btn:focus-visible { color: var(--on-gold); }
.btn:hover:not(:disabled)::before, .btn:focus-visible::before { transform: translateY(0); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { border-color: transparent; color: var(--ink-soft); padding-left: .3rem; padding-right: .3rem; }
.btn.ghost::before { background: transparent; border-bottom: 1px solid var(--gold); transform: scaleX(0); transform-origin: left; transition: transform .35s var(--ease-klinge); }
.btn.ghost:hover:not(:disabled), .btn.ghost:focus-visible { color: var(--ink); }
.btn.ghost:hover:not(:disabled)::before, .btn.ghost:focus-visible::before { transform: scaleX(1); }
.btn.big { width: 100%; padding: .8rem 1.6rem; font-size: 1.1rem; background: var(--bg); }
.iconbtn { width: 2.1rem; height: 2.1rem; flex: none; display: grid; place-items: center; padding: 0; background: none; border: 1px solid transparent;
  border-radius: 50%; color: var(--ink-soft); cursor: pointer; transition: color var(--t-kurz) ease, border-color var(--t-kurz) ease; }
.iconbtn:hover, .iconbtn:focus-visible { color: var(--ink); border-color: var(--line); }
.iconbtn.del:hover { color: var(--err); }

/* Windrose für Wald und Felder */
.compass { display: grid; grid-template-columns: repeat(3, 2.5rem); gap: 3px; }
.compass button { height: 2.1rem; padding: 0; font-size: .85rem; background: var(--surface); border: 1px solid var(--line); border-radius: 2px; color: var(--ink-soft);
  cursor: pointer; transition: background-color .25s ease, color .25s ease, border-color .25s ease; }
.compass button:hover { border-color: var(--gold); color: var(--ink); }
.compass button.on { background: var(--gold-hi); border-color: var(--gold-hi); color: var(--on-gold); }
.compass .mid { display: grid; place-items: center; }
.compass .mid::before { content: ""; width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--gold); }

/* Staub: 5x5-Raster über der Karte, Stärke je Feld (aus, wenig, mittel, Finsternis) */
.dustgrid { display: grid; grid-template-columns: repeat(5, 1.6rem); gap: 3px; }
.dustgrid.one { grid-template-columns: 4.4rem; }
.dustgrid button { height: 1.6rem; padding: 0; font-size: .8rem; background: var(--surface); border: 1px solid var(--line);
  border-radius: 2px; color: var(--ink-soft); cursor: pointer; transition: background-color .25s ease, border-color .25s ease; }
.dustgrid button:hover { border-color: var(--gold); }
.dustgrid button.d1 { background: color-mix(in srgb, #3b342b 35%, var(--surface)); color: var(--ink); }
.dustgrid button.d2 { background: color-mix(in srgb, #1b1712 70%, var(--surface)); color: #e8e0d0; }
.dustgrid button.d3 { background: #0c0a08; border-color: #000; color: #d8c9a0; }

/* Viertel und Orte: eckige Karten mit Haarlinie */
.list { display: grid; gap: .7rem; }
.item { display: grid; gap: .5rem; padding: .7rem; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 45%, transparent); }
.item .row > * { flex: 1; }
.item .row > .iconbtn, .item .row > input[type=checkbox] { flex: 0 0 auto; }


/* Ansicht */
.toolbar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; padding: .55rem 1rem; border-bottom: 1px solid var(--line); }
.toolbar .sp { flex: 1; }
#zoomLbl { min-width: 3.4rem; text-align: center; font-variant-numeric: tabular-nums; }
#status { font-size: .95rem; color: var(--ink-soft); }
#status.err { color: var(--err); }
#hints:empty { display: none; }
#hints { padding: .6rem 1rem 0; display: grid; gap: .4rem; }
#hints div { padding: .55rem 1rem; border-left: 2px solid var(--gold); background: color-mix(in srgb, var(--gold-hi) 8%, transparent); color: var(--ink-soft); font-size: .95rem; }
#stage { flex: 1; overflow: auto; position: relative; cursor: grab; background: var(--surface); }
#stage.drag { cursor: grabbing; }
#mapWrap[hidden], #empty[hidden] { display: none; }
#mapWrap { position: relative; margin: 0 auto; }
#mapWrap img { display: block; width: 100%; image-rendering: auto; user-select: none; -webkit-user-drag: none; }
#labels { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible;
  user-select: none; -webkit-user-select: none; }
#labels.edit [data-key] { pointer-events: all; cursor: move; }
#wallDraw { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
#wallDraw[hidden] { display: none; }
#stage.draw, #stage.draw * { cursor: crosshair !important; }
#stage.overpt, #stage.overpt * { cursor: move !important; }
#stage.wdrag, #stage.wdrag * { cursor: grabbing !important; }
.drawbar { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
#labels.edit [data-key]:hover, #labels [data-key].moving { filter: drop-shadow(0 0 4px var(--gold-hi)); }
.btn.on { color: var(--on-gold); }
.btn.on::before { transform: translateY(0); }
.viewswitch { display: inline-flex; }
.viewswitch[hidden] { display: none; }
.viewswitch .btn + .btn { margin-left: -1px; }
.viewswitch .btn { padding: .35rem .8rem; }
.viewswitch .btn:disabled { cursor: progress; }

#empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 2rem; }
#empty .sun { width: 96px; aspect-ratio: 800/1035; margin: 0 auto 1.6rem; background: url(/static/sor-symbol.png) center/contain no-repeat; opacity: .5;
  -webkit-mask-image: linear-gradient(#000 55%, transparent 98%); mask-image: linear-gradient(#000 55%, transparent 98%); }
#empty .eyebrow { display: block; font-family: var(--font-display); font-style: italic; color: var(--gold); font-size: 1.15rem; }
#empty h2 { font-size: clamp(2rem, 4vw, 3rem); margin: .3rem 0 .9rem; }
#empty p { margin: 0 auto; max-width: 36ch; color: var(--ink-soft); font-size: 1.05rem; }

#busy { position: absolute; inset: 0; display: none; place-items: center; background: var(--veil); z-index: 5; }
#busy.on { display: grid; animation: fade-from .4s ease; }
#stage:has(#busy.on) #empty { visibility: hidden; }
#busy .sun { width: 64px; aspect-ratio: 800/1035; margin: 0 auto 1.2rem; background: url(/static/sor-symbol.png) center/contain no-repeat;
  animation: glimmen 2.2s var(--ease-glut) infinite alternate; }
#busy .msg { font-family: var(--font-display); font-size: 1.5rem; }
#busy .hint { font-variant-numeric: tabular-nums; margin-top: .3rem; }
@keyframes glimmen { from { opacity: .35; filter: brightness(.5); transform: translateY(6px); } to { opacity: 1; filter: none; transform: none; } }
@keyframes fade-from { from { opacity: 0; } }

@media (max-width: 900px) {
  html, body { height: auto; }
  main, #viewer { flex-direction: column; }
  #home, #wizard { overflow: visible; }
  aside { width: auto; min-width: 0; overflow: visible; border-right: 0; border-bottom: 1px solid var(--line); padding-bottom: 0; }
  .generate { bottom: 0; }
  #stage { flex: none; height: 75vh; }
}
@media (max-width: 640px) {
  .choices { grid-template-columns: 1fr; }
  .steps .st { display: none; }
  .steps .cur .st { display: inline; }
  .wiznav .btn.big { min-width: 0; flex: 1; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <span class="mark" role="img" aria-label="Symbol des Sor"></span>
    <div><span class="eyebrow">Die Alte Ordnung</span><h1>Stadtkarten-Werkstatt <span class="ver" id="ver" title="Programmversion"></span></h1></div>
  </div>
  <span class="sp"></span>
  <div class="tools">
    <button class="btn ghost" id="btnHome" type="button" hidden title="Zurück zur Startseite">Startseite</button>
    <button class="round theme" id="btnTheme" type="button" aria-label="Design wechseln" title="Hell / Dunkel">
      <svg class="i sonne" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>
      <svg class="i mond" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.2 8.2 0 0 1 9.5 4a8.3 8.3 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>
</header>
<main>
  <section id="home" aria-label="Startseite">
    <div class="home-in">
      <div class="sun" aria-hidden="true"></div>
      <span class="eyebrow">Die Alte Ordnung</span>
      <h2>Was möchtest du tun?</h2>
      <div class="choices">
        <button type="button" class="choice" id="chNew" disabled>
          <span class="t"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M12 11v6M9 14h6"/></svg>Neue Stadtkarte</span>
          <span class="d">Schritt für Schritt durch alle Einstellungen: Allgemein, Gelände, Befestigung, Viertel, Orte und Ausgabe.</span>
        </button>
        <button type="button" class="choice" id="chRandom" disabled>
          <span class="t"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1.5"/><circle cx="8.5" cy="8.5" r=".9" fill="currentColor"/><circle cx="15.5" cy="15.5" r=".9" fill="currentColor"/><circle cx="12" cy="12" r=".9" fill="currentColor"/><circle cx="15.5" cy="8.5" r=".9" fill="currentColor"/><circle cx="8.5" cy="15.5" r=".9" fill="currentColor"/></svg>Zufällige Stadtkarte</span>
          <span class="d">Alle Einstellungen werden gewürfelt und die Karte sofort gezeichnet.</span>
        </button>
        <button type="button" class="choice" id="chOpen" disabled>
          <span class="t"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Stadtkarte öffnen</span>
          <span class="d">Eine gespeicherte Stadtbeschreibung (.yaml) laden; die Karte wird sofort gezeichnet.</span>
        </button>
        <button type="button" class="choice" id="chExample" aria-expanded="false" aria-controls="examples" disabled>
          <span class="t"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6c-2-1.5-5-2-8-2v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2z"/><path d="M12 6v14"/></svg>Beispiel laden</span>
          <span class="d">Eine der mitgelieferten Städte zeichnen und von dort aus anpassen.</span>
        </button>
      </div>
      <div class="examples" id="examples" hidden>
        <div class="lbl">Beispiel wählen</div>
        <div class="exlist" id="exList"></div>
      </div>
      <div class="hint homemsg" id="homeMsg" role="status"></div>
      <input type="file" id="fileYaml" accept=".yaml,.yml" hidden>
    </div>
  </section>
  <section id="wizard" aria-label="Einstellungen" hidden><div class="wiz" id="form"></div></section>
  <section id="viewer" hidden>
  <aside id="side" aria-label="Einstellungen"></aside>
  <div class="vmain">
    <div class="toolbar">
      <button class="iconbtn" id="zoomOut" title="Verkleinern" aria-label="Verkleinern"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="btn ghost" id="zoomFit" title="Ganze Karte">Ganz</button>
      <button class="iconbtn" id="zoomIn" title="Vergrößern" aria-label="Vergrößern"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
      <span id="zoomLbl" class="hint"></span>
      <span class="viewswitch" id="viewSwitch" role="group" aria-label="Tag oder Nacht" hidden>
        <button type="button" class="btn on" id="btnTag" aria-pressed="true" title="Tagkarte anzeigen"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>Tag</button>
        <button type="button" class="btn" id="btnNacht" aria-pressed="false" disabled><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.2 8.2 0 0 1 9.5 4a8.3 8.3 0 1 0 10.5 10.5z"/></svg>Nacht</button>
      </span>
      <button class="btn" id="btnMove" disabled title="Beschriftungen mit der Maus verschieben; Doppelklick setzt eine Beschriftung zurück"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M9.5 5.5L12 3l2.5 2.5M9.5 18.5L12 21l2.5-2.5M5.5 9.5L3 12l2.5 2.5M18.5 9.5L21 12l-2.5 2.5"/></svg>Beschriftung verschieben</button>
      <button class="btn ghost" id="btnResetLabels" disabled title="Alle Beschriftungen wieder an ihren automatischen Platz setzen">Zurücksetzen</button>
      <span class="sp"></span>
      <span id="status"></span>
      <span class="sp"></span>
      <button class="btn" data-fmt="png" disabled>PNG</button>
      <button class="btn" data-fmt="webp" disabled title="kleiner, gut für Foundry/Roll20">WebP</button>
      <button class="btn" data-fmt="pdf" disabled>PDF</button>
      <button class="btn" data-fmt="svg" disabled>SVG</button>
      <button class="btn" data-fmt="html" disabled title="interaktive Karte für den Browser: zoomen, Beschriftung ein-/ausblenden">Interaktiv</button>
      <button class="btn" data-fmt="web" disabled title="für die eigene Webseite: Kartenbild ohne Beschriftung (WebP), Beschriftung (SVG), Ortsliste (JSON) und Stadtbeschreibung als ZIP">Web-Paket</button>
      <button class="btn ghost" id="btnSaveOut" disabled title="SVG, PNG, PDF und interaktive Karte (HTML) der gerade angezeigten Karte (Tag oder Nacht) in den Kartenordner schreiben">Alle Formate speichern</button>
      <button class="btn ghost" id="btnSaveYaml" title="Stadtbeschreibung als .yaml speichern – auf der Startseite mit „Stadtkarte öffnen“ wieder zu laden">Als .yaml speichern</button>
    </div>
    <div id="hints"></div>
    <div id="stage">
      <div id="empty"><div>
        <div class="sun" aria-hidden="true"></div>
        <span class="eyebrow">Der Tisch ist leer</span>
        <h2>Noch keine Karte</h2>
        <p id="emptyMsg"></p>
      </div></div>
      <div id="mapWrap" hidden><img id="map" alt="Erzeugte Stadtkarte"><svg id="labels" xmlns="http://www.w3.org/2000/svg"></svg><svg id="wallDraw" viewBox="0 0 100 100" preserveAspectRatio="none" hidden></svg></div>
      <div id="busy"><div style="text-align:center"><div class="sun" aria-hidden="true"></div><div class="msg">Die Karte wird gezeichnet …</div><div class="hint" id="busyTime"></div></div></div>
    </div>
  </div>
  </section>
</main>

<script>
const DIRS = [["nordwest","NW"],["nord","N"],["nordost","NO"],["west","W"],null,["ost","O"],["suedwest","SW"],["sued","S"],["suedost","SO"]];
const DIR_NAMES = {nord:"Nord", nordost:"Nordost", ost:"Ost", suedost:"Südost", sued:"Süd", suedwest:"Südwest", west:"West", nordwest:"Nordwest", mitte:"Mitte"};
const COAST = {nord:"Norden", ost:"Osten", sued:"Süden", west:"Westen", keine:"keine Küste"};
const BIOME = {gemaessigt:"Gemäßigt (Wiesen & Wälder)", sumpf:"Sumpf (Pfahlbauten)", nordland:"Nordland (Schnee & Eis)", steppe:"Steppe", heide:"Heide", herbst:"Herbstland", auwald:"Auwald (Flussaue)", mittelmeer:"Mittelmeer", dschungel:"Dschungel", hochmoor:"Hochmoor", wueste:"Wüste & Oasen", gebirge:"Gebirge (Zwergenstadt)", hochplateau:"Hochplateau"};
const DTYPE = {hafen:"Hafen", handwerk:"Handwerk", arbeiter:"Arbeiter", fischer:"Fischer", bauern:"Bauern", adel:"Adel", tempel:"Tempelbezirk", markt:"Markt", wohn:"Wohnviertel", armen:"Armenviertel"};
const PTYPE = {gasthaus:"Gasthaus", laden:"Laden", schmiede:"Schmiede", muehle:"Windmühle (vor der Stadt)", wassermuehle:"Wassermühle (am Fluss)", kontor:"Kontor", werft:"Werft", adelshaus:"Adelshaus", palast:"Palast", rathaus:"Rathaus / Dorfhalle", bauernhof:"Bauernhof mit Stall (vor der Stadt)", tempel:"Tempel / Schrein", kathedrale:"Kathedrale / Dom", kaserne:"Kaserne", friedhof:"Friedhof", festung:"Festung / Bastion", marktplatz:"Marktplatz", badehaus:"Badehaus", magierturm:"Magierturm", arena:"Arena", faerberei:"Färberei (am Wasser)", hafenkran:"Hafenkran (am Ufer)", kloster:"Kloster (vor der Stadt)", richtstaette:"Richtstätte (vor der Stadt)"};
const FORM = {zufall: "Zufall (je Seed)", rund: "Rund", oval: "Oval (langgestreckt)", unregelmaessig: "Unregelmäßig",
              vieleck: "Vieleckig (gerade Mauern)", gewachsen: "Gewachsen (mit Ausbuchtungen)",
              eigene: "Eigene (Mauer selbst zeichnen)"};
const PLAGE = {festung: [["insel","auf einer Insel"],["landzunge","auf einer Landzunge"],["land","an Land vor der Stadt"]],
               friedhof: [["","im Ort (wenn Platz)"],["ausserhalb","vor der Stadt"]]};

let OPT = null, cfg = null, resultId = null, zoom = null, mapW = 0;
const $ = s => document.querySelector(s);

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "on") for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn);
    else if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
// Linien-Icons im Stil des Design Systems (24er-Raster, Strich 1.5)
const ICON = {
  x: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  wuerfel: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1.5"/><circle cx="8.5" cy="8.5" r=".9" fill="currentColor"/><circle cx="15.5" cy="15.5" r=".9" fill="currentColor"/><circle cx="12" cy="12" r=".9" fill="currentColor"/><circle cx="15.5" cy="8.5" r=".9" fill="currentColor"/><circle cx="8.5" cy="15.5" r=".9" fill="currentColor"/></svg>',
};
const iconBtn = (icon, title, onclick, cls = "") => el("button", {type: "button", class: "iconbtn " + cls, title, "aria-label": title, html: ICON[icon], on: {click: onclick}});
function select(options, value, onchange) {
  const s = el("select", {on: {change: e => onchange(e.target.value)}});
  for (const [v, t] of options) s.append(el("option", {value: v, selected: String(v) === String(value ?? "")}, t));
  return s;
}
const field = (label, input, hint) => el("label", {class: "f"}, el("span", {}, label), hint ? el("div", {}, input, el("div", {class: "hint"}, hint)) : input);
// >>> Standardwerte: kommen vom Server (OPT.defaults und OPT.optional, Quelle ist config.py); ein Test führt diesen Block aus
const plain = v => v !== null && typeof v === "object" && !Array.isArray(v);
function fillDefaults(c, d) {   // trägt fehlende (nicht angegebene oder leere) Angaben aus d ein, Abschnitte rekursiv
  for (const [k, v] of Object.entries(d)) {
    if (plain(v)) { if (!plain(c[k])) c[k] = {}; fillDefaults(c[k], v); }
    else c[k] ??= JSON.parse(JSON.stringify(v));
  }
}
function norm(c) {
  // wie config.from_dict: ausdrücklich leer (wald: / felder:) heißt „kein Wald“ bzw. „keine Felder“, fehlend heißt Standard
  if (plain(c.gelaende)) for (const k of ["wald", "felder"]) if (c.gelaende[k] === null) c.gelaende[k] = [];
  fillDefaults(c, OPT.defaults);
  for (const k of ["wald", "felder"]) c.gelaende[k] = [].concat(c.gelaende[k]);   // auch ein einzelner Wert ist erlaubt
  for (const o of c.orte) if (o.typ === "bastion" || o.typ === "burg") o.typ = "festung";
  return c;
}
const optional = key => OPT.optional[key];   // Wert einer weglassbaren Angabe, wenn sie fehlt (z.B. "ausgabe.stil")
// <<< Standardwerte

function compass(list, onchange) {
  const box = el("div", {class: "compass"});
  for (const d of DIRS) {
    if (!d) { box.append(el("div", {class: "mid"})); continue; }
    const b = el("button", {type: "button", class: list.includes(d[0]) ? "on" : "", title: DIR_NAMES[d[0]], "aria-pressed": String(list.includes(d[0]))}, d[1]);
    b.onclick = () => { const i = list.indexOf(d[0]); i >= 0 ? list.splice(i, 1) : list.push(d[0]); b.classList.toggle("on"); b.setAttribute("aria-pressed", String(i < 0)); onchange?.(); };
    box.append(b);
  }
  return box;
}

const DUST = ["", "wenig", "mittel", "finsternis"];
const DUST_LBL = {wenig: "wenig", mittel: "mittel", finsternis: "Finsternis"};
function dustGrid(g) {   // 5x5 Felder über der Karte: Spalten A-E von links, Zeilen 1-5 von oben
  g.staub ??= {};
  const box = el("div", {class: "dustgrid"});
  const cell = (key, label, title) => {
    const b = el("button", {type: "button"}, label);
    const paint = () => {
      const v = g.staub[key] || "";
      b.className = v ? "d" + DUST.indexOf(v) : "";
      b.title = title + ": " + (DUST_LBL[v] || "kein Staub");
    };
    b.onclick = () => {   // Klick schaltet weiter: aus → wenig → mittel → Finsternis → aus
      const next = DUST[(DUST.indexOf(g.staub[key] || "") + 1) % DUST.length];
      if (next) g.staub[key] = next; else delete g.staub[key];
      paint();
    };
    paint();
    return b;
  };
  for (const r of "12345") for (const c of "abcde") box.append(cell(c + r, "", `Feld ${c.toUpperCase()}${r}`));
  return {grid: box, city: cell("mitte", "Stadt", "Über der Stadt")};
}

// Assistent: jede Seite fragt nur einen Themenbereich ab
const STEPS = ["Allgemein", "Gelände", "Befestigung", "Viertel", "Besondere Orte", "Ausgabe"];
const STEPS_KURZ = ["Allgemein", "Gelände", "Befestigung", "Viertel", "Orte", "Ausgabe"];   // für die Schrittleiste
const INTRO = [
  "Name, Größe und Umriss der Stadt.",
  "Küste, Fluss, Wald, Felder und Staub rund um die Stadt.",
  "Stadtmauer, Tore und Vorstädte.",
  "Stadtviertel mit eigenem Charakter.",
  "Gasthäuser, Tempel, Festungen und andere Orte, die auf der Karte benannt werden.",
  "Bildgröße, Stil und weitere Optionen der fertigen Karte.",
];
let step = 0, wizError = "";

// Größe: Regler logarithmisch von 300 Einwohnern (erlaubt sind ab 100) bis zum Höchstwert des Servers; ab der Großstadt-Grenze
// wird die Stadt in Häuserblöcken gezeichnet. POP_MAX, GROSS und BRIDGES_MAX (Brücken über den Fluss) kommen aus
// OPT.limits (beim Start gesetzt).
const POP_MIN = 300;
let POP_MAX, GROSS, BRIDGES_MAX;
const popLabel = n => `${n.toLocaleString("de-DE")} Einwohner` + (n < 2500 ? " (Dorf)" : n >= GROSS ? " (Großstadt: Häuserblöcke, Altstadt, Vorstädte)" : "");
const toPop = v => { const n = POP_MIN * (POP_MAX / POP_MIN) ** (v / 1000);
  const rund = n < 2000 ? 50 : n < GROSS ? 100 : 1000; return Math.min(POP_MAX, Math.round(n / rund) * rund); };
const toPos = n => Math.round(Math.log(Math.max(POP_MIN, Math.min(POP_MAX, n)) / POP_MIN) / Math.log(POP_MAX / POP_MIN) * 1000);

function goStep(i) {
  step = Math.max(0, Math.min(STEPS.length - 1, i)); wizError = "";
  renderForm(); $("#wizard").scrollTop = 0;
}

function stepper() {
  return el("ol", {class: "steps"}, STEPS.map((t, i) => el("li", {class: i === step ? "cur" : i < step ? "done" : ""},
    el("button", {type: "button", "aria-current": i === step ? "step" : null, on: {click: () => goStep(i)}},
      el("span", {class: "n"}, String(i + 1)), el("span", {class: "st"}, STEPS_KURZ[i])))));
}

// Die Seiten des Formulars. Der Assistent zeigt sie einzeln (side = false), die Seitenleiste neben der Karte alle
// untereinander (side = true).
function formPages(side) {
  const g = cfg.gelaende;
  const num = (obj, key, attrs = {}) => el("input", {type: "number", value: obj[key], ...attrs,
    on: {input: e => { obj[key] = e.target.value === "" ? "" : Number(e.target.value); }}});
  // refresh: nach dem Verlassen des Feldes neu aufbauen (z.B. Viertelnamen in den Orte-Auswahllisten)
  const txt = (obj, key, attrs = {}, refresh = false) => el("input", {type: "text", value: obj[key] ?? "", ...attrs,
    on: {input: e => { obj[key] = e.target.value; }, change: () => { if (refresh) renderForm(); }}});
  const chk = (obj, key, after) => el("input", {type: "checkbox", checked: !!obj[key], on: {change: e => { obj[key] = e.target.checked; after?.(); }}});
  const eigene = cfg.stadtform === "eigene";

  // 1. Allgemein
  const pageAllgemein = () => {
    const popOut = el("div", {class: "hint"}, popLabel(cfg.einwohner));
    const pop = el("input", {type: "range", min: 0, max: 1000, step: 1, value: toPos(cfg.einwohner),
      on: {input: e => { cfg.einwohner = toPop(Number(e.target.value)); popOut.textContent = popLabel(cfg.einwohner); }}});
    const seedIn = num(cfg, "seed", {min: 0});
    return [
      field("Name", txt(cfg, "name")),
      field("Größe", el("div", {}, pop, popOut)),
      field("Stadtform", select(Object.entries(FORM), cfg.stadtform, v => { cfg.stadtform = v; if (v !== "eigene") drawEnd(); renderForm(); drawWall(); }),
            "Umriss der Stadt; „Zufall“ wählt je Seed eine Form."),
      eigene && !side ? field("Mauer", el("div", {class: "hint"},
        "Auf der letzten Seite erzeugst du zuerst nur das Gelände. Darauf zeichnest du die Mauer: Linksklick setzt einen Turm, " +
        "Taste T ein Tor an der Maus, Rücktaste nimmt den letzten Punkt zurück, Rechtsklick beendet. Beginnt und endet die Mauer " +
        "an der Küste (bzw. an der Plateaukante), ist die Stadt dort offen – Küste und Felswand sind dann die Mauer. " +
        "Danach „Stadt erzeugen“. Türme und Tore lassen sich später mit „Mauer bearbeiten“ verschieben, einfügen und löschen.")) : null,
      eigene && side ? field("Mauer", el("div", {class: "drawbar"},
        el("button", {type: "button", class: "btn" + (drawMode ? " on" : ""), id: "btnDraw",
          on: {click: () => drawMode ? drawEnd() : drawStart()}}, drawMode ? "Zeichnen beenden" : "Mauer zeichnen"),
        el("button", {type: "button", class: "btn" + (editMode ? " on" : ""), id: "btnEdit", disabled: !wallPts().length,
          title: "Türme und Tore verschieben, einfügen, löschen und umschalten, ohne die Mauer neu zu zeichnen",
          on: {click: () => editMode ? drawEnd() : editStart()}}, editMode ? "Bearbeiten beenden" : "Mauer bearbeiten"),
        el("button", {type: "button", class: "btn ghost", disabled: !wallPts().length,
          on: {click: () => { drawEnd(true); wallSnap(); cfg.mauer.punkte = []; drawWall(); renderForm(); }}}, "Mauer löschen"),
        el("span", {class: "hint", id: "wallInfo"}, wallInfo())),
        "Erst „Gelände erzeugen“, dann zeichnen: Linksklick setzt einen Turm, Taste T ein Tor an der Maus, " +
        "Rücktaste nimmt den letzten Punkt zurück, Rechtsklick beendet. Beginnt und endet die Mauer an der Küste " +
        "(bzw. an der Plateaukante), ist die Stadt dort offen – Küste und Felswand sind dann die Mauer. " +
        "„Mauer bearbeiten“: Punkte ziehen; Doppelklick auf einen Punkt schaltet zwischen Turm und Tor um, Doppelklick " +
        "auf die Mauer fügt einen Turm ein (Taste T über der Mauer ein Tor); Entf oder Rechtsklick löscht den Punkt unter der " +
        "Maus; Strg+Z macht den letzten Schritt rückgängig. Danach „Stadt erzeugen“: Straßen, Viertel und Häuser " +
        "richten sich neu nach der Mauer.") : null,
      field("Bebauung", select([["dicht", "Dicht (wie bisher)"], ["locker", "Locker (+40 % Fläche)"],
                                ["weitlaeufig", "Weitläufig (fast doppelte Fläche)"]],
        cfg.bebauung ?? optional("bebauung"), v => { if (v === optional("bebauung")) delete cfg.bebauung; else cfg.bebauung = v; }),
        "Gleiche Einwohner auf mehr Fläche: größere Grundstücke, Gärten, breitere Gassen."),
      field("Seed", el("div", {class: "row"}, seedIn,
        iconBtn("wuerfel", "Zufälliger Seed", () => { cfg.seed = randomSeed(); seedIn.value = cfg.seed; })),
        "Gleicher Seed und gleiche Angaben ergeben dieselbe Karte."),
    ];
  };

  // 2. Gelände
  const pageGelaende = () => {
    const mtn = g.biotop === "gebirge", plat = g.biotop === "hochplateau";
    const sides = Object.entries(COAST).filter(([k]) => k !== "keine").map(([k, v]) => [k, "im " + v]);
    const riverW = el("input", {type: "range", min: 20, max: 110, step: 2, value: g.flussbreite, disabled: !g.fluss,
      on: {input: e => g.flussbreite = Number(e.target.value)}});
    const bridgeN = num(g, "bruecken", {min: 1, max: BRIDGES_MAX, disabled: !g.fluss});
    const dg = dustGrid(g), dirs = Object.keys(g.staub ?? {}).filter(k => DIR_NAMES[k] && k !== "mitte");
    return [
      field("Biotop", select(OPT.biomes.map(b => [b, BIOME[b] ?? b]), g.biotop, v => {
        g.biotop = v; if ((v === "gebirge" || v === "hochplateau") && g.kueste === "keine") g.kueste = "nord";
        if (v === "hochplateau") { g.plateau ??= optional("gelaende.plateau"); g.kante ??= optional("gelaende.kante"); } renderForm(); })),
      mtn && eigene ? el("div", {class: "wizerr", role: "alert"}, "Die eigene Stadtform gibt es im Gebirge noch nicht – bitte unter „Allgemein“ eine andere Stadtform wählen.") : null,
      mtn ? field("Berg", select(sides, g.kueste, v => { g.kueste = v; }), "Seite, auf der das Felsmassiv liegt.")
          : plat ? field("Kante", select(sides, g.kueste, v => { g.kueste = v; }), "Seite, auf der die Plateaukante verläuft.")
          : field("Küste", select(Object.entries(COAST), g.kueste, v => { g.kueste = v; renderForm(); })),
      plat ? field("Stadt", select([["oben", "Auf dem Plateau"], ["unten", "Am Fuße des Plateaus"]], g.plateau ?? optional("gelaende.plateau"),
                                   v => { g.plateau = v; })) : null,

  const pageAusgabe = () => [

                                ["fuellend", "Füllend (Stadt, Hafen, Festung passen gerade)"]],
      cfg.ausgabe.ausschnitt ?? optional("ausgabe.ausschnitt"),
      v => { if (v === optional("ausgabe.ausschnitt")) delete cfg.ausgabe.ausschnitt; else cfg.ausgabe.ausschnitt = v; }),
      "Wie viel der Karte die Stadt einnimmt. Näher heißt größere, detailreichere Häuser; Schrift bleibt gleich groß."),
    field("Raster", num(cfg.ausgabe, "raster", {min: 0, step: 10}), "Pixel pro Feld, 0 = kein Raster"),
    field("Legende", el("div", {class: "row"}, chk(cfg.ausgabe, "legende"))),

    field("Dachdetails", el("div", {class: "row"}, chk(cfg.ausgabe, "dachdetails"),
      el("span", {class: "hint"}, "Ziegel, Schiefer, Reet, Schornsteine (SVG wird etwas größer)"))),
  ];

  return [pageAllgemein, pageGelaende, pageBefestigung, pageViertel, pageOrte, pageAusgabe];
}

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const ct = r.headers.get("Content-Type") || "";
  const data = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(data.error || data || r.statusText);
  return data;
}
function status(text, err = false) { const s = $("#status"); s.textContent = text; s.className = err ? "err" : ""; }

// Ansichten: Startseite, Assistent, Karte

function showView(v) {
  if (v !== "viewer") drawEnd();

  view = v;
  for (const id of ["home", "wizard", "viewer"]) $("#" + id).hidden = id !== v;
  $("#btnHome").hidden = v === "home";
  if (wechsel) {   // das Formular gibt es nur einmal (Assistent oder Seitenleiste), sonst wären Schaltflächen doppelt
    $("#form").innerHTML = ""; $("#side").innerHTML = "";
    renderForm();
    if (v === "wizard") $("#wizard").scrollTop = 0;
  }
  if (v === "viewer" && zoom !== null && $("#map").naturalWidth) applyZoom();
  window.scrollTo(0, 0);
}

// Ansicht leeren, bevor eine andere Karte beginnt (sonst blitzt kurz die alte auf)
function resetViewer() {

const EMPTY_MSG = "Prüfe links die Angaben und klicke auf „Karte erzeugen“.";

// Tag und Nacht: zu jeder Karte gehören zwei Bilder (erst die Vorschau, später die volle Auflösung). Die Tagkarte
// erscheint zuerst; die Nachtkarte wird danach im Hintergrund geholt, der Schalter wird aktiv, sobald sie da ist.
let ansicht = "tag", bilder = {tag: {}, nacht: {}}, nachtZustand = "aus", nachtFehler = "";   // aus | rechnen | bereit | fehler
let mapInfo = "", tagVollOffen = false, nachtVollOffen = false;
function resetAnsicht() {
  for (const v of ["tag", "nacht"]) for (const k of ["preview", "full"]) { const u = bilder[v][k]; if (u?.startsWith("blob:")) URL.revokeObjectURL(u); }
  ansicht = "tag"; bilder = {tag: {}, nacht: {}}; nachtZustand = "aus"; nachtFehler = "";
  tagVollOffen = nachtVollOffen = false; mapInfo = ""; syncAnsicht();
}
function syncAnsicht() {
  $("#viewSwitch").hidden = nachtZustand === "aus";
  for (const [id, v] of [["#btnTag", "tag"], ["#btnNacht", "nacht"]]) {
    $(id).classList.toggle("on", ansicht === v); $(id).setAttribute("aria-pressed", String(ansicht === v));
  }
  const n = $("#btnNacht");
  n.disabled = nachtZustand !== "bereit";
  n.title = nachtZustand === "bereit" ? "Nachtkarte anzeigen" : nachtZustand === "rechnen" ? "Die Nachtkarte wird noch berechnet …"
    : nachtZustand === "fehler" ? (nachtFehler || "Die Nachtkarte ist nicht verfügbar.") : "";
}
function mapStatus() {
  if (!mapInfo) return;
  const nacht = nachtZustand === "rechnen";
  const voll = tagVollOffen || (nachtZustand === "bereit" && nachtVollOffen);
  let t = mapInfo;
  if (voll && nacht) t += " · volle Auflösung und Nachtkarte werden berechnet …";
  else if (voll) t += " · volle Auflösung wird berechnet …";
  else if (nacht) t += " · Nachtkarte wird berechnet …";
  else if (nachtZustand === "fehler") t += " · Nachtkarte nicht verfügbar";
  status(t);
}
function waehleAnsicht(v) {
  if (!resultId || v === ansicht || (v === "nacht" && nachtZustand !== "bereit")) return;
  ansicht = v; syncAnsicht();
  showImage(bilder[v].full || bilder[v].preview);
}
async function holeNacht(id) {
  const bild = async url => { const r = await fetch(url); if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText); return URL.createObjectURL(await r.blob()); };
  try {
    const preview = await bild(`/api/nacht?id=${id}`);   // wartet, bis der Server die Nachtkarte gezeichnet hat
    if (resultId !== id) { URL.revokeObjectURL(preview); return; }
    bilder.nacht.preview = preview; nachtZustand = "bereit"; nachtVollOffen = true;
    syncAnsicht(); mapStatus();
    if (ansicht === "nacht") showImage(preview);
    try {   // volle Auflösung im Hintergrund nachladen und still austauschen, wie bei der Tagkarte
      const full = await bild(`/api/full?id=${id}&version=nacht`);
      if (resultId !== id) { URL.revokeObjectURL(full); return; }
      bilder.nacht.full = full;
      if (ansicht === "nacht") showImage(full);
    } catch (e) { /* bleibt bei der Vorschau */ }
    nachtVollOffen = false; mapStatus();
  } catch (e) {
    if (resultId !== id) return;
    nachtZustand = "fehler"; nachtFehler = e.message; syncAnsicht(); mapStatus();
  }
}
$("#btnTag").onclick = () => waehleAnsicht("tag");
$("#btnNacht").onclick = () => waehleAnsicht("nacht");

function randomSeed() { return Math.floor(Math.random() * 99999) + 1; }

// Neue Stadtkarte: Assistent mit Grundwerten, Seite 1

}

function homeStatus(text, err = false) { const s = $("#homeMsg"); s.textContent = text; s.className = "hint homemsg" + (err ? " err" : ""); }

let generating = false;
async function generateMap(from) {
  if (generating) return false;   // ein Klick genügt; die Seitenleiste lässt sich währenddessen weiter bedienen
  generating = true;
  const reedit = editMode;   // wer die Mauer bearbeitet hat, will danach meist weiter bearbeiten
  drawEnd(true);
  showView("viewer");
  const btn = $("#btnGen"); if (btn) btn.disabled = true;
  $("#busy").classList.add("on"); $("#hints").innerHTML = "";
  const t0 = Date.now();
  const tick = setInterval(() => $("#busyTime").textContent = `${Math.round((Date.now() - t0) / 1000)} s – meist 5–15 s`, 500);
  let ok = false;
  try {
    const res = await api("/api/generate", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(cfg)});
    resultId = res.id; mapW = res.W;
    const lab = $("#labels");
    lab.setAttribute("viewBox", `0 0 ${res.W} ${res.W}`); lab.innerHTML = res.labels;
    resetAnsicht(); bilder.tag.preview = res.preview;
    nachtZustand = res.nacht ? "rechnen" : "aus"; syncAnsicht();
    showImage(res.preview);
    terrainOnly = !!res.gelaende_nur; drawWall();
    if (terrainOnly) $("#hints").append(el("div", {}, "Gelände ohne Stadt: jetzt links unter „Allgemein“ die Mauer zeichnen und dann „Stadt erzeugen“."));
    for (const h of res.hints) $("#hints").append(el("div", {}, h));
    document.querySelectorAll("[data-fmt], #btnSaveOut, #btnMove").forEach(b => b.disabled = false);
    updateResetButton();
    mapInfo = `${cfg.name}: ${res.stats.gebaeude} Gebäude, ${res.stats.baeume} Bäume – ${res.stats.sekunden} s`;
    tagVollOffen = true; mapStatus();
    // Vorschau ist halb so groß; die volle Auflösung im Hintergrund holen und still austauschen
    fetch(`/api/full?id=${res.id}`).then(r => r.ok ? r.blob() : Promise.reject()).then(b => {
      if (resultId !== res.id) return;
      bilder.tag.full = URL.createObjectURL(b);
      if (ansicht === "tag") showImage(bilder.tag.full);
    }).catch(() => {}).finally(() => { if (resultId === res.id) { tagVollOffen = false; mapStatus(); } });
    if (res.nacht) holeNacht(res.id);   // erst die Tagkarte, dann im Hintergrund die Nachtkarte
    ok = true;
  } catch (e) {
    status("Fehler: " + e.message, true);
    if (from === "wizard") {   // Angaben stimmen nicht: zurück zur letzten Seite, dort steht die Meldung
      wizError = e.message; step = STEPS.length - 1; showView("wizard");
    } else $("#emptyMsg").textContent = "Die Karte konnte nicht gezeichnet werden: " + e.message;
  } finally {
    clearInterval(tick); $("#busy").classList.remove("on");
    generating = false;
    const b = $("#btnGen"); if (b) b.disabled = false;
    if (reedit && cfg.stadtform === "eigene" && view === "viewer") editStart(true);
  }
  return ok;
}

// Zufällige Stadtkarte: würfelt alle Angaben des Assistenten, aber nur stimmige Kombinationen
// (Hafen nur mit Wasser, Wassermühle nur mit Fluss, höchstens ein Palast usw.). Die eigene Stadtform bleibt
// außen vor, sie braucht das Zeichnen der Mauer.
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const chance = p => Math.random() < p;
const sample = (a, n) => { const c = [...a], out = []; while (c.length && out.length < n) out.push(c.splice(rnd(c.length), 1)[0]); return out; };
const wpick = pairs => { let r = Math.random() * pairs.reduce((s, p) => s + p[1], 0);
  for (const [v, w] of pairs) if ((r -= w) < 0) return v; return pairs[pairs.length - 1][0]; };
const WIND = ["nord", "nordost", "ost", "suedost", "sued", "suedwest", "west", "nordwest"];

// Stadtnamen: Vorsilbe + Endung, je nach Biotop

function randomCfg() {
  const biotop = wpick(OPT.biomes.map(b => [b, b === "gemaessigt" ? 4 : 1]));
  const mtn = biotop === "gebirge", plat = biotop === "hochplateau";
  const sides = ["nord", "ost", "sued", "west"];
  const kueste = mtn || plat ? pick(sides) : wpick([...sides.map(s => [s, 2]), ["keine", 2]]);
  const fluss = biotop === "auwald" || chance(0.6);   // Altarme und Auwald gibt es nur am Fluss
  const wasser = (kueste !== "keine" && !mtn && !plat) || fluss;
  const g = {biotop, kueste, fluss, flussbreite: 30 + 2 * rnd(31), inseln: kueste !== "keine" && !mtn && !plat ? rnd(4) : 0,
    bruecken: fluss ? wpick([[1, 5], [2, 3], [3, 2], [4, 1]]) : 1};
  if (plat) { g.plateau = pick(["oben", "unten"]); g.kante = pick(["direkt", "abstand"]); }
  g.wald = biotop === "wueste" ? [] : sample(WIND, rnd(4));
  g.felder = biotop === "wueste" || biotop === "nordland" ? sample(WIND, rnd(2)) : sample(WIND, rnd(4));
  if (chance(0.45)) {   // Staub nur am Kartenrand, damit die Stadt sichtbar bleibt
    const rand = [];
    for (const r of "12345") for (const c of "abcde") if ("ae".includes(c) || "15".includes(r)) rand.push(c + r);
    g.staub = {};
    for (const k of sample(rand, 1 + rnd(4))) g.staub[k] = wpick([["wenig", 5], ["mittel", 3], ["finsternis", 1]]);
    if (chance(0.15)) g.staub.ueberall = "wenig";
    if (chance(0.1)) g.staub.mitte = "wenig";
  }

  // Größe: viele Dörfer und Städte, selten eine Großstadt
  const tier = wpick([["dorf", 20], ["klein", 35], ["mittel", 30], ["gross", 15]]);
  const [lo, hi] = {dorf: [300, 2400], klein: [2500, 6000], mittel: [6000, GROSS - 1000], gross: [GROSS, 50000]}[tier];
  const einwohner = toPop(toPos(lo + Math.random() * (hi - lo)));

  const parts = NAME_PARTS[biotop] ?? NAME_PARTS.gemaessigt;
  const name = pick(parts[0]) + pick(wasser && !mtn ? [...parts[1], "hafen"] : parts[1]);
  const c = {
    name, seed: randomSeed(), einwohner,
    stadtform: pick(Object.keys(FORM).filter(k => k !== "eigene")),
    gelaende: g,
    mauer: {vorhanden: chance(0.85), tore: 2 + rnd(5)},
    viertel: [], orte: [],
    ausgabe: {stil: chance(0.5) ? "pergament" : chance(0.3) ? "standard" : pick(OPT.styles.map(([k]) => k).filter(k => k !== "pergament" && k !== "standard")),
              ausschnitt: wpick(wasser ? [["weit", 70], ["fuellend", 30]] : [["weit", 50], ["normal", 25], ["nah", 15], ["fuellend", 10]])},
  };
  if (!chance(0.8)) c.mauer.vorstaedte = false;
  const beb = wpick([["dicht", 60], ["locker", 25], ["weitlaeufig", 15]]);
  if (beb !== optional("bebauung")) c.bebauung = beb;
  if (c.ausgabe.stil === optional("ausgabe.stil")) delete c.ausgabe.stil;
  if (c.ausgabe.ausschnitt === optional("ausgabe.ausschnitt")) delete c.ausgabe.ausschnitt;

  // Viertel: Hafen nur mit Wasser (im Gebirge und auf dem Plateau gibt es weder Hafen noch Fischer)
  let types = OPT.district_types.filter(t => !((mtn || plat) && (t === "hafen" || t === "fischer")) && (t !== "hafen" || wasser));
  const nV = einwohner < 2500 ? rnd(3) : einwohner < GROSS ? 2 + rnd(4) : 4 + rnd(4);
  const chosen = sample(types, nV);
  if (types.includes("hafen") && chance(0.7) && !chosen.includes("hafen") && nV > 0) chosen[0] = "hafen";
  const lagen = sample(Object.keys(DIR_NAMES), Object.keys(DIR_NAMES).length);
  for (const typ of chosen) {
    const v = {name: pick(DISTRICT_NAMES[typ]), typ};
    if (typ === "hafen") v.groesse = pick(["klein", "mittel", "gross"]);
    else if (typ === "armen" && chance(0.35)) v.ausserhalb = true;
    else if (chance(0.5) && lagen.length) v.lage = lagen.pop();
    if (v.groesse === optional("viertel.groesse")) delete v.groesse;
    c.viertel.push(v);
  }
  const hafen = c.viertel.find(v => v.typ === "hafen");
  const viertelNamen = c.viertel.filter(v => v.typ !== "hafen").map(v => v.name);   // der Hafen bleibt Kontor und Werft vorbehalten

  // Besondere Orte
  const nO = einwohner < 2500 ? 1 + rnd(4) : einwohner < GROSS ? 3 + rnd(6) : 5 + rnd(8);
  const einmal = new Set(["palast", "rathaus", "kathedrale", "kaserne", "festung", "friedhof", "marktplatz", "arena", "magierturm", "kloster", "richtstaette", "hafenkran", "faerberei"]);
  const mindest = {palast: 15000, kathedrale: 8000, kaserne: 5000, adelshaus: 1500, tempel: 1000, kontor: 1500, werft: 1500,
    marktplatz: 3000, arena: 6000, badehaus: 2500, magierturm: 1500, faerberei: 1500, hafenkran: 1500, kloster: 1500, richtstaette: 800};   // Einwohner
  const draussen = new Set(["muehle", "wassermuehle", "bauernhof", "festung", "kloster", "richtstaette"]);
  let ptypes = OPT.place_types.filter(t => !(t === "wassermuehle" && !fluss) && !(t === "festung" && mtn) && !((mtn || plat) && ["muehle", "bauernhof", "wassermuehle", "kloster", "richtstaette"].includes(t))
    && !(["faerberei", "hafenkran"].includes(t) && !wasser)
    && !((t === "kontor" || t === "werft") && (!hafen || hafen.groesse === "klein")) && einwohner >= (mindest[t] ?? 0));
  const benutzt = {};
  for (let i = 0; i < nO && ptypes.length; i++) {
    const typ = pick(ptypes);
    benutzt[typ] = (benutzt[typ] ?? 0) + 1;
    if (einmal.has(typ) || (draussen.has(typ) && benutzt[typ] >= 2)) ptypes = ptypes.filter(t => t !== typ);
    const pool = PLACE_NAMES[typ].filter(n => !c.orte.some(o => o.name === n));
    const o = {name: pick(pool.length ? pool : PLACE_NAMES[typ]), typ};
    if (typ === "festung") o.lage = wpick([["land", 3], ...(kueste !== "keine" && !mtn && !plat ? [["insel", 2], ["landzunge", 2]] : [])]);
    else if (typ === "friedhof") { if (chance(0.3)) o.lage = "ausserhalb"; else if (viertelNamen.length && chance(0.4)) o.viertel = pick(viertelNamen); }
    else if (typ === "kontor" || typ === "werft") o.viertel = hafen.name;
    else if (!draussen.has(typ) && viertelNamen.length && chance(0.5)) o.viertel = pick(viertelNamen);
    if (typ === "gasthaus" && chance(0.35)) { o.name = "Schenke"; o.kuerzel = "S"; o.anzahl = 2 + rnd(4); }
    c.orte.push(o);
  }
  return norm(c);
}

// Bild anzeigen; bei anderer Auflösung (Vorschau ↔ voll) bleiben Ausschnitt und Bildschirmgröße erhalten
let lastNatural = 0;
function showImage(src) {
  const img = $("#map"), st = $("#stage");
  img.onload = () => {
    $("#empty").hidden = true; $("#mapWrap").hidden = false;
    if (zoom === null) { fit(); }
    else {
      const k = lastNatural ? lastNatural / img.naturalWidth : 1;
      const sl = st.scrollLeft, stp = st.scrollTop;
      zoom *= k; applyZoom(); st.scrollLeft = sl; st.scrollTop = stp;
    }
    lastNatural = img.naturalWidth;
    drawWall();   // gezeichnete Mauer erst zeigen, wenn die Karte sichtbar ist
  };
  img.src = src;
}

// Ansicht: Zoom und Verschieben
function applyZoom() {
  const img = $("#map"); if (!img.naturalWidth) return;
  $("#mapWrap").style.width = Math.round(img.naturalWidth * zoom) + "px";
  // Prozent bezogen auf die volle Kartengröße (die Vorschau ist nur halb so groß)
  const fullW = Number(cfg?.ausgabe?.bildgroesse) || img.naturalWidth;
  $("#zoomLbl").textContent = Math.round(zoom * img.naturalWidth / fullW * 100) + " %";
}
function fit() {
  const st = $("#stage"), img = $("#map"); if (!img.naturalWidth) return;
  zoom = Math.min((st.clientWidth - 8) / img.naturalWidth, (st.clientHeight - 8) / img.naturalHeight); applyZoom();
}
function zoomBy(f, cx, cy) {
  const st = $("#stage"); if (zoom === null) return;
  const old = zoom; zoom = Math.max(0.1, Math.min(3, zoom * f));
  cx ??= st.clientWidth / 2; cy ??= st.clientHeight / 2;
  const x = (st.scrollLeft + cx) / old, y = (st.scrollTop + cy) / old;
  applyZoom(); st.scrollLeft = x * zoom - cx; st.scrollTop = y * zoom - cy;
}
$("#zoomIn").onclick = () => zoomBy(1.25);
$("#zoomOut").onclick = () => zoomBy(0.8);
$("#zoomFit").onclick = fit;
const stage = $("#stage");
stage.addEventListener("wheel", e => {
  if (!$("#map").naturalWidth || $("#mapWrap").hidden) return;
  e.preventDefault(); const r = stage.getBoundingClientRect();
  zoomBy(e.deltaY < 0 ? 1.15 : 0.87, e.clientX - r.left, e.clientY - r.top);
}, {passive: false});
// Mauer zeichnen und bearbeiten (Stadtform "eigene"): Punkte in Prozent der Karte, [x, y, "turm" | "tor"].
// Jeder Punkt ist eine Ecke der Mauer. Beim Bearbeiten lassen sich Türme und Tore verschieben, einfügen, löschen und
// umschalten. Die Stadt entsteht erst mit „Stadt erzeugen“ neu: Straßen, Viertel und Häuser richten sich nach der Mauer.
let drawMode = false, editMode = false, terrainOnly = false, lastPos = null;
let hoverPt = null, hoverEdge = null, wallDrag = null;   // Bearbeiten: Punkt und Mauerseite unter der Maus, gezogener Punkt
let wallHist = [];                                        // frühere Punktlisten für „Rückgängig“ (Strg+Z)
function wallPts() { return (cfg && cfg.mauer && cfg.mauer.punkte) || []; }
function wallSnap() { wallHist.push(JSON.stringify(wallPts())); if (wallHist.length > 50) wallHist.shift(); }
function wallUndo() {
  if (!wallHist.length) return;
  cfg.mauer.punkte = JSON.parse(wallHist.pop());
  hoverPt = hoverEdge = null; wallDrag = null;
  if (editMode && !wallPts().length) { drawEnd(); }
  renderForm(); drawWall(); status("Rückgängig gemacht");
}
function segCross(a, b, c, d) {   // schneiden sich die Strecken ab und cd (echter Schnitt)?
  const o = (p, q, r) => Math.sign((q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]));
  return o(a, b, c) * o(a, b, d) < 0 && o(c, d, a) * o(c, d, b) < 0;
}
// Mauerseiten (Index i = Strecke von Punkt i zu i+1), die sich kreuzen. Die Schlusslinie vom letzten zum ersten Punkt
// zählt nicht mit: bei einer an der Küste offenen Mauer ist sie keine Mauer.
function wallCrossings() {
  const p = wallPts(), bad = new Set();
  for (let i = 0; i < p.length - 1; i++) for (let j = i + 2; j < p.length - 1; j++)
    if (segCross(p[i], p[i + 1], p[j], p[j + 1])) { bad.add(i); bad.add(j); }
  return bad;
}
function wallInfo() {
  const p = wallPts(), tore = p.filter(q => q[2] === "tor").length;
  if (!p.length) return "noch keine Mauer";
  return `${p.length - tore} Türme, ${tore} Tore` + (p.length < 3 ? " – mindestens 3 Punkte" : !tore ? " – noch kein Tor" : "")
    + (wallCrossings().size ? " – die Mauer kreuzt sich (rot)" : "");
}
function mapPos(e) {
  const r = $("#mapWrap").getBoundingClientRect();
  return [Math.round((e.clientX - r.left) / r.width * 10000) / 100, Math.round((e.clientY - r.top) / r.height * 10000) / 100];
}
function wallScreen(q) {   // Punkt der Mauer in Bildschirmpixeln
  const r = $("#mapWrap").getBoundingClientRect();
  return [r.left + q[0] / 100 * r.width, r.top + q[1] / 100 * r.height];
}
// Was liegt unter der Maus: ein Punkt der Mauer (11 px Fangradius) oder, sonst, eine Mauerseite (7 px)
function wallHit(e) {
  const p = wallPts(), r = $("#mapWrap").getBoundingClientRect();
  let pt = null, dmin = 11;
  p.forEach((q, i) => { const [x, y] = wallScreen(q), d = Math.hypot(e.clientX - x, e.clientY - y); if (d <= dmin) { dmin = d; pt = i; } });
  if (pt !== null || p.length < 2) return {pt, edge: null};
  let edge = null; dmin = 7;
  for (let i = 0; i < p.length; i++) {
    if (p.length < 3 && i === p.length - 1) break;   // die Schlusslinie gibt es erst ab drei Punkten
    const a = wallScreen(p[i]), b = wallScreen(p[(i + 1) % p.length]);
    const dx = b[0] - a[0], dy = b[1] - a[1], t = Math.max(0, Math.min(1, ((e.clientX - a[0]) * dx + (e.clientY - a[1]) * dy) / ((dx * dx + dy * dy) || 1)));
    const x = a[0] + t * dx, y = a[1] + t * dy, d = Math.hypot(e.clientX - x, e.clientY - y);
    if (d <= dmin) { dmin = d; edge = {i, pos: [Math.round((x - r.left) / r.width * 10000) / 100, Math.round((y - r.top) / r.height * 10000) / 100]}; }
  }
  return {pt: null, edge};
}
function drawWall() {
  const svg = $("#wallDraw"), p = wallPts();
  const show = cfg && cfg.stadtform === "eigene" && (drawMode || editMode || terrainOnly) && !$("#mapWrap").hidden;
  svg.toggleAttribute("hidden", !show);   // SVG-Elemente kennen die Eigenschaft .hidden nicht
  if (!show) return;
  const pts = p.map(q => `${q[0]},${q[1]}`).join(" "), bad = wallCrossings();
  let h = "";
  if (p.length > 1) h += `<polyline points="${pts}" fill="none" stroke="#2a2018" vector-effect="non-scaling-stroke" style="stroke-width:5px"/>`
                       + `<polyline points="${pts}" fill="none" stroke="#c9b98f" style="stroke-width:2.5px" vector-effect="non-scaling-stroke"/>`;
  for (const i of bad)   // sich kreuzende Mauerseiten rot
    h += `<line x1="${p[i][0]}" y1="${p[i][1]}" x2="${p[i + 1][0]}" y2="${p[i + 1][1]}" stroke="#d13a2a" style="stroke-width:3.5px" vector-effect="non-scaling-stroke"/>`;
  if (p.length > 2) h += `<line x1="${p[p.length - 1][0]}" y1="${p[p.length - 1][1]}" x2="${p[0][0]}" y2="${p[0][1]}" stroke="#c9b98f" style="stroke-width:2px" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/>`;
  if (p.length > 2) h += `<polygon points="${pts}" fill="#c9b98f" fill-opacity="0.12" stroke="none"/>`;
  const k = editMode ? 1.6 : 1;   // beim Bearbeiten etwas größere Griffe
  p.forEach((q, i) => {
    if (editMode && i === hoverPt || wallDrag?.i === i)   // Punkt unter der Maus bzw. in der Hand
      h += `<circle cx="${q[0]}" cy="${q[1]}" r="${1.5 * k}" fill="none" stroke="#fff3c4" style="stroke-width:2px" vector-effect="non-scaling-stroke"/>`;
    h += q[2] === "tor"
      ? `<rect x="${q[0] - 0.7 * k}" y="${q[1] - 0.7 * k}" width="${1.4 * k}" height="${1.4 * k}" fill="#b23a2a" stroke="#2a2018" style="stroke-width:1.5px" vector-effect="non-scaling-stroke"/>`
      : `<circle cx="${q[0]}" cy="${q[1]}" r="${0.6 * k}" fill="#d9a441" stroke="#2a2018" style="stroke-width:1.5px" vector-effect="non-scaling-stroke"/>`;
  });
  if (editMode && hoverEdge)   // „+“ auf der Mauerseite unter der Maus: hier lässt sich ein Punkt einfügen
    h += `<circle cx="${hoverEdge.pos[0]}" cy="${hoverEdge.pos[1]}" r="${1.1}" fill="#fff3c4" stroke="#2a2018" style="stroke-width:1.5px" vector-effect="non-scaling-stroke"/>`;
  svg.innerHTML = h;
  const info = $("#wallInfo"); if (info) info.textContent = wallInfo();
}
function addPoint(kind) {
  if (!lastPos) return;
  wallSnap();
  cfg.mauer.punkte = [...wallPts(), [lastPos[0], lastPos[1], kind]];
  drawWall(); refreshGen();
}
function refreshGen() {
  const b = $("#btnGen"); if (b) b.textContent = genLabel();
}
function drawStart() {
  if ($("#mapWrap").hidden) { status("Zuerst „Gelände erzeugen“ – darauf wird die Mauer gezeichnet.", true); return; }
  drawEnd(true);
  drawMode = true; stage.classList.add("draw"); renderForm(); drawWall();
  status("Mauer zeichnen: Linksklick = Turm, T = Tor, Rücktaste = zurück, Rechtsklick = fertig");
}
function editStart(quiet = false) {
  if ($("#mapWrap").hidden || !wallPts().length) return;
  drawEnd(true);
  editMode = true; hoverPt = hoverEdge = null; stage.classList.add("edit"); renderForm(); drawWall();
  if (!quiet) status("Mauer bearbeiten: Punkt ziehen · Doppelklick auf Punkt = Turm/Tor · Doppelklick auf die Mauer = Turm einfügen · " +
                     "T = Tor einfügen · Entf = Punkt löschen · Strg+Z = zurück · Esc = fertig");
}
function drawEnd(silent = false) {
  if (!drawMode && !editMode) return;
  const war = drawMode;
  drawMode = editMode = false; hoverPt = hoverEdge = null; wallDrag = null;
  stage.classList.remove("draw", "edit", "overpt", "wdrag"); renderForm(); drawWall();
  if (!silent) status(war ? (wallPts().length >= 3 ? "Mauer fertig – jetzt „Stadt erzeugen“." : "Zeichnen beendet.")
                          : "Bearbeiten beendet – jetzt „Stadt erzeugen“, damit die Stadt zur Mauer passt.");
}
function wallInsert(i, pos, kind) {   // nach Punkt i einen neuen Punkt einfügen (bei der Schlusslinie: ans Ende)
  wallSnap();
  const p = [...wallPts()]; p.splice(i + 1, 0, [pos[0], pos[1], kind]);
  cfg.mauer.punkte = p; hoverPt = i + 1; hoverEdge = null;
  renderForm(); drawWall();
}
function wallRemove(i) {
  wallSnap();
  cfg.mauer.punkte = wallPts().filter((_, k) => k !== i); hoverPt = hoverEdge = null;
  if (!wallPts().length) drawEnd(true);
  renderForm(); drawWall();
}
function wallToggle(i) {
  wallSnap();
  const q = wallPts()[i]; q[2] = q[2] === "tor" ? "turm" : "tor";
  drawWall();
}
function wallDragEnd(e) {
  if (!wallDrag) return;
  try { stage.releasePointerCapture(e.pointerId); } catch (err) {}
  wallDrag = null; stage.classList.remove("wdrag"); drawWall(); refreshGen();
}
stage.addEventListener("pointerdown", e => {
  if (e.button !== 0 || $("#mapWrap").hidden) return;
  if (drawMode) {
    e.stopImmediatePropagation(); e.preventDefault();
    lastPos = mapPos(e); addPoint("turm");
  } else if (editMode) {
    const h = wallHit(e);
    if (h.pt === null) return;   // daneben: die Ansicht lässt sich wie sonst verschieben
    e.stopImmediatePropagation(); e.preventDefault();
    pressed = null;
    wallDrag = {i: h.pt, x: e.clientX, y: e.clientY, moved: false};
    stage.setPointerCapture(e.pointerId); stage.classList.add("wdrag");
  }
}, true);
stage.addEventListener("pointermove", e => {
  if (drawMode) lastPos = mapPos(e);
  if (!editMode || $("#mapWrap").hidden) return;
  if (wallDrag) {
    if (!wallDrag.moved && Math.hypot(e.clientX - wallDrag.x, e.clientY - wallDrag.y) < 4) return;   // Wackeln beim Doppelklick zählt nicht
    if (!wallDrag.moved) { wallSnap(); wallDrag.moved = true; }
    const [x, y] = mapPos(e), q = wallPts()[wallDrag.i];
    q[0] = Math.max(0, Math.min(100, x)); q[1] = Math.max(0, Math.min(100, y));
    drawWall();
    return;
  }
  const h = wallHit(e);
  if (h.pt !== hoverPt || h.edge || hoverEdge) {
    hoverPt = h.pt; hoverEdge = h.edge;
    stage.classList.toggle("overpt", hoverPt !== null || hoverEdge !== null);
    drawWall();
  }
}, true);
stage.addEventListener("pointerup", wallDragEnd, true);
stage.addEventListener("pointercancel", wallDragEnd, true);
stage.addEventListener("lostpointercapture", wallDragEnd, true);
stage.addEventListener("pointerleave", () => { if (editMode && !wallDrag && (hoverPt !== null || hoverEdge)) { hoverPt = hoverEdge = null; stage.classList.remove("overpt"); drawWall(); } });
stage.addEventListener("dblclick", e => {
  if (!editMode || $("#mapWrap").hidden) return;
  const h = wallHit(e);
  if (h.pt !== null) { wallToggle(h.pt); e.stopImmediatePropagation(); }                       // Turm <-> Tor
  else if (h.edge) { wallInsert(h.edge.i, h.edge.pos, "turm"); e.stopImmediatePropagation(); }  // Turm einfügen
}, true);
stage.addEventListener("contextmenu", e => {
  if (drawMode) { e.preventDefault(); drawEnd(); }
  else if (editMode) { e.preventDefault(); const h = wallHit(e); if (h.pt !== null) wallRemove(h.pt); else drawEnd(); }
});
document.addEventListener("keydown", e => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(document.activeElement?.tagName)) return;
  if ((e.ctrlKey || e.metaKey) && (e.key === "z" || e.key === "Z")) {   // Rückgängig, auch nach „Mauer löschen“
    if (view === "viewer" && cfg?.stadtform === "eigene" && wallHist.length) { e.preventDefault(); wallUndo(); }
    return;
  }
  if (drawMode) {
    if (e.key === "t" || e.key === "T") { e.preventDefault(); addPoint("tor"); }
    else if (e.key === "Backspace") { e.preventDefault(); wallSnap(); cfg.mauer.punkte = wallPts().slice(0, -1); drawWall(); refreshGen(); }
    else if (e.key === "Escape") drawEnd();
  } else if (editMode) {
    if (e.key === "t" || e.key === "T") {   // über einem Punkt: Turm <-> Tor; über der Mauer: ein Tor einfügen
      if (hoverPt !== null) { e.preventDefault(); wallToggle(hoverPt); }
      else if (hoverEdge) { e.preventDefault(); wallInsert(hoverEdge.i, hoverEdge.pos, "tor"); }
    } else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); if (hoverPt !== null) wallRemove(hoverPt); }
    else if (e.key === "Escape") drawEnd();
  }
});

let drag = null, moving = null, pressed = null;
stage.addEventListener("pointerdown", e => {
  const g = pressed = e.target.closest?.("#labels.edit [data-key]");
  if (g) {   // Beschriftung anfassen
    const [dx, dy] = labelOffset(g.dataset.key);
    moving = {g, x: e.clientX, y: e.clientY, dx, dy, k: mapW / $("#mapWrap").clientWidth};
    g.classList.add("moving");
  } else {
    drag = {x: e.clientX, y: e.clientY, l: stage.scrollLeft, t: stage.scrollTop}; stage.classList.add("drag");
  }
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", e => {
  if (moving) {
    moving.nx = moving.dx + (e.clientX - moving.x) * moving.k;
    moving.ny = moving.dy + (e.clientY - moving.y) * moving.k;
    moving.g.setAttribute("transform", `translate(${moving.nx.toFixed(1)},${moving.ny.toFixed(1)})`);
  } else if (drag) { stage.scrollLeft = drag.l - (e.clientX - drag.x); stage.scrollTop = drag.t - (e.clientY - drag.y); }
});
function endPointer() {
  if (moving) {
    moving.g.classList.remove("moving");
    if (moving.nx !== undefined) setLabelOffset(moving.g.dataset.key, moving.nx, moving.ny);
    moving = null;
  }
  drag = null; stage.classList.remove("drag");
}
stage.addEventListener("pointerup", endPointer);
// abgebrochene Geste (z.B. Touch vom System übernommen): Ziehen nicht hängen lassen
stage.addEventListener("pointercancel", endPointer);
stage.addEventListener("lostpointercapture", endPointer);
stage.addEventListener("dblclick", () => {   // Ziel ist wegen setPointerCapture die Ansicht, daher "pressed"
  const g = pressed;
  if (g && $("#labels").classList.contains("edit")) { g.setAttribute("transform", "translate(0,0)"); setLabelOffset(g.dataset.key, 0, 0); }
});

// Beschriftungen verschieben: gespeichert in cfg.beschriftung als [dx, dy] in Prozent der Kartenbreite,
// damit sie beim nächsten Erzeugen, in der .yaml und in allen Downloads erhalten bleiben
function labelOffset(key) {
  const v = cfg.beschriftung[key] || [0, 0];
  return [v[0] * mapW / 100, v[1] * mapW / 100];
}
function setLabelOffset(key, px, py) {
  const pct = v => Math.round(v / mapW * 10000) / 100;
  if (pct(px) || pct(py)) cfg.beschriftung[key] = [pct(px), pct(py)];
  else delete cfg.beschriftung[key];
  updateResetButton(); sendLabels();
}
async function sendLabels() {
  if (!resultId) return;
  try {
    await api("/api/labels", {method: "POST", body: JSON.stringify({id: resultId, beschriftung: cfg.beschriftung})});
  } catch (e) { status("Fehler: " + e.message, true); }
}
function updateResetButton() { $("#btnResetLabels").disabled = !resultId || !Object.keys(cfg.beschriftung).length; }
$("#btnMove").onclick = () => {
  const on = $("#labels").classList.toggle("edit");
  $("#btnMove").classList.toggle("on", on);
  if (on) status("Beschriftung mit der Maus ziehen · Doppelklick setzt sie zurück · Ziehen daneben verschiebt die Ansicht");
};
$("#btnResetLabels").onclick = () => {
  cfg.beschriftung = {};
  document.querySelectorAll("#labels [data-key]").forEach(g => g.setAttribute("transform", "translate(0,0)"));
  updateResetButton(); sendLabels();
};

// Downloads
document.querySelectorAll("[data-fmt]").forEach(b => b.onclick = () => {
  if (!resultId) return;
  const url = `/api/download?id=${resultId}&format=${b.dataset.fmt}&version=${ansicht}`;
  if (window.stadtkarteDownload) window.stadtkarteDownload(url); else window.location.href = url;   // die Browserversion (web/) liefert die Datei selbst
});
$("#btnSaveOut").onclick = async () => {
  try {
    const res = await api("/api/save", {method: "POST", body: JSON.stringify({id: resultId, version: ansicht})});
    status("Gespeichert in " + res.folder + ": " + res.paths.map(p => p.split(/[\\/]/).pop()).join(", "));
  } catch (e) { status("Fehler: " + e.message, true); }
};

// Design wechseln (hell/dunkel), Wahl wird im Browser gemerkt
$("#btnTheme").onclick = () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("dao-theme", next); } catch (e) {}
};

// Stadtbeschreibung (.yaml) speichern; „Stadtkarte öffnen“ liest sie wieder ein
$("#btnSaveYaml").onclick = async () => {
  try {
    const out = {...cfg};
    if (!Object.keys(out.beschriftung).length) delete out.beschriftung;
    const text = await api("/api/yaml", {method: "POST", body: JSON.stringify(out)});
    const a = el("a", {href: URL.createObjectURL(new Blob([text], {type: "text/yaml"})),
      download: (cfg.name || "stadt").toLowerCase().replace(/[^a-z0-9äöüß]+/g, "_") + ".yaml"});
    document.body.append(a); a.click(); a.remove();
    status("Stadtbeschreibung gespeichert – sie lässt sich auf der Startseite mit „Stadtkarte öffnen“ wieder laden.");
  } catch (e) { status("Fehler: " + e.message, true); }
};
$("#fileYaml").onchange = async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  let c;
  try {
    const raw = await api("/api/parse", {method: "POST", body: await file.text()});
    if (!raw || typeof raw !== "object" || Array.isArray(raw)) throw new Error("Die Datei enthält keine Stadtbeschreibung.");
    c = norm(raw);
  } catch (err) { homeStatus(`„${file.name}“ konnte nicht gelesen werden: ${err.message}`, true); return; }
  homeStatus("");
  await openCfg(c);
};

// Startseite
$("#chNew").onclick = startNew;
$("#chRandom").onclick = () => { homeStatus(""); randomMap(); };
$("#chOpen").onclick = () => $("#fileYaml").click();
$("#chExample").onclick = () => {
  const p = $("#examples"); p.hidden = !p.hidden;
  $("#chExample").setAttribute("aria-expanded", String(!p.hidden));
  if (!p.hidden) p.scrollIntoView({block: "nearest"});
};
$("#btnHome").onclick = () => showView("home");

(async () => {
  try {
    OPT = await api("/api/options");
    POP_MAX = OPT.limits.einwohner_max; GROSS = OPT.limits.grossstadt; BRIDGES_MAX = OPT.limits.bruecken_max;
  }
  catch (e) { homeStatus("Die Werkstatt konnte nicht gestartet werden: " + e.message, true); return; }
  $("#btnSaveOut").title = "SVG, PNG, PDF und interaktive Karte der gerade angezeigten Karte (Tag oder Nacht) speichern nach " + OPT.output_dir;
  if (OPT.version) $("#ver").textContent = "v" + OPT.version;
  for (const ex of OPT.examples)
    $("#exList").append(el("button", {type: "button", class: "btn", on: {click: () => loadExample(ex)}}, ex[0].toUpperCase() + ex.slice(1)));
  document.querySelectorAll(".choice").forEach(b => b.disabled = false);
  if (!OPT.examples.length) $("#chExample").hidden = true;
  showView("home");
})();
window.addEventListener("resize", () => { if (zoom !== null && $("#map").naturalWidth) applyZoom(); });
</script>
</body>
</html>
